name: Frontend CI - Build & Push to Docker Hub

on:
  push:
    branches:
      - sujeeth_docker_v4          # triggers on every push/merge to main
  pull_request:
    branches:
      - sujeeth_docker_v4       # builds only (no push) on PRs to catch errors early

permissions:
  contents: read      # least privilege — only read the repo

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true   # cancel older runs if you push again quickly

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Lint & Test  (runs on every push + PR)
  # ─────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm              # caches node_modules between runs

      - name: Install dependencies
        run: npm ci               # clean install — respects package-lock.json

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test -- --ci     # --ci flag: no interactive prompts, strict

      - name: Build check
        run: npm run build        # catch compile errors before building image

  # ─────────────────────────────────────────────
  # JOB 2: Build & Push  (only on push to main, not PRs)
  # ─────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: test                   # only runs if test job passes
    runs-on: ubuntu-latest
    if: github.event_name == 'push'   # skip on PRs — don't push unreviewed code

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}   # use Access Token, NOT password

      - name: Extract metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: sujeeth123/velson-erp-frontend
          tags: |
            type=sha,prefix=sha-,format=short   # e.g. sha-abc1234  (traceability)
            type=raw,value=latest               # always update latest tag

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}  # adds git metadata to image
          cache-from: type=gha                       # restore cache from GitHub Actions
          cache-to: type=gha,mode=max                # save max layers to cache

      - name: Summarize in workflow
        run: |
          echo "### Docker Image Published 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`sujeeth123/velson-erp-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY